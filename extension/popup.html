<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width: 300px; font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; color: #004AAD; }
  label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 8px; border: 1px solid #d0d7e2; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  button { margin-top: 10px; width: 100%; background: #004AAD; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  #status { font-size: 12px; color: #22a559; margin-top: 8px; display: none; }
  .note { font-size: 11px; color: #888; margin-top: 12px; line-height: 1.4; }
</style>
</head>
<body>
  <h2>🛡️ BhashaGuard AI</h2>
  <label for="backendUrl">Backend URL</label>
  <input id="backendUrl" type="text" placeholder="https://your-app.onrender.com">
  <button id="saveBtn">Save</button>
  <div id="status">Saved ✓</div>
  <div class="note">Set this to your deployed BhashaGuard backend URL. The extension checks the current page against it and shows a warning banner for high-risk pages.</div>
  <script src="popup.js"></script>
</body>
</html>
